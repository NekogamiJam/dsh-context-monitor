  <path d="M44 78v24h1352V78" fill="#fff"/>
  <circle cx="76" cy="68" r="7" fill="#f17c78"/><circle cx="99" cy="68" r="7" fill="#f4c85f"/><circle cx="122" cy="68" r="7" fill="#69c786"/>
