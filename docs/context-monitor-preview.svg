  <rect x="1151" y="51" width="203" height="34" rx="17" fill="#edf7f1"/>
  <circle cx="1171" cy="68" r="5" fill="#48a875"/><text x="1185" y="73" class="tiny" style="fill:#347e58">只读监控 · 示意数据</text>

  <text x="88" y="153" style="font-size:29px;font-weight:700">上下文</text>
  <text x="88" y="183" class="body muted">只读监控 · 不改变压缩、缓存或模型请求</text>
  <text x="1350" y="158" text-anchor="end" class="small muted">本图为界面示意，全部数字为虚构样例</text>

