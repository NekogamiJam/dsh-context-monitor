<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">上下文监控界面示意</title>
  <desc id="desc">虚构数据演示上下文水位、缓存读取比例和压缩结构，不含真实会话信息。</desc>
  <defs>
    <linearGradient id="readFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3978f6" stop-opacity=".26"/><stop offset="1" stop-color="#3978f6" stop-opacity=".025"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#25365b" flood-opacity=".07"/></filter>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#202b3b} .muted{fill:#738096} .tiny{font-size:13px}.small{font-size:15px}.body{font-size:17px}.heading{font-size:21px;font-weight:650}.number{font-size:27px;font-weight:700}.card{fill:#fff;stroke:#e2e7ef;stroke-width:1}.axis{stroke:#e9edf3;stroke-width:1}.blue{stroke:#3978f6;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#df6973;stroke-width:2;stroke-dasharray:6 6}.pill{fill:#edf3ff}.pillText{fill:#285fca;font-size:13px;font-weight:600}
    </style>
  </defs>
